[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerrl"
version = "0.1.0"
description = "Small exact-evaluation Kuhn poker learning experiment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pokerkit==0.7.7", "torch==2.10.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "basedpyright"]
cloud = ["modal>=1.5,<2"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
include = ["pokerrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["pokerrl"]
